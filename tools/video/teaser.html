<!doctype html>
<html><head><meta charset="utf-8"><title>tarzan teaser render</title>
<style>html,body{margin:0;background:#111}canvas#c{width:960px;height:600px;display:block}</style>
<script type="importmap">{"imports":{"three":"../../js/vendor/three.module.min.js","three/examples/jsm/environments/RoomEnvironment.js":"../../js/vendor/RoomEnvironment.js"}}</script>
</head><body><canvas id="c" width="960" height="600"></canvas>
<script type="module">
// Tarzan Bot kit teaser: exploded-view assembly then a short climb. Pure function of t (seconds); render with renderAt(t).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const OW = 960, OH = 600, SS = 2; // output size, supersampling
const out = document.getElementById('c'), o2 = out.getContext('2d');
const glc = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(OW * SS, OH * SS, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(30, OW / OH, 0.1, 100);
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); }
scene.add(new THREE.HemisphereLight(0xFFF4E0, 0x6D6880, 0.6));
const key = new THREE.DirectionalLight(0xFFF1DC, 1.6); key.position.set(-3, 6, 7); scene.add(key);
const rim = new THREE.DirectionalLight(0x9FD8FF, 0.8); rim.position.set(4, 2, -5); scene.add(rim);

// house materials (js/lens.js)
const M = {
  slate: new THREE.MeshStandardMaterial({ color: 0x444A68, roughness: 0.38, metalness: 0.35, envMapIntensity: 0.9 }),
  coral: new THREE.MeshStandardMaterial({ color: 0xF0644A, roughness: 0.82, envMapIntensity: 0.4 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xFFC83D, roughness: 0.32, envMapIntensity: 0.8 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xCDD2DC, roughness: 0.26, metalness: 0.85, envMapIntensity: 1.0 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x1FA898, roughness: 0.4, envMapIntensity: 0.7 }),
  red: new THREE.MeshStandardMaterial({ color: 0xE5483A, roughness: 0.5 }),
  navy: new THREE.MeshStandardMaterial({ color: 0x23284A, roughness: 0.5 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xF3E3C3, roughness: 0.6 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2E3140, roughness: 0.5 }),
};
function ropeTexture() { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#34384A'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#5A5F78'; g.lineWidth = 9;
  for (let k = -64; k < 128; k += 21) { g.beginPath(); g.moveTo(0, k); g.lineTo(64, k + 30); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

/* ---------------- parts (bot-local frame: origin = wheel axle, +z toward camera side) ---------------- */
const R = 0.62, WW = R * 0.42; // wheel radius, half width
const RG = R * 0.84;            // groove floor radius (band sits here)
const BT = 0.058;               // band tube radius
const RC = RG + BT;             // rolling radius on the rope (distance / RC = wheel turn)
const ROPE_R = 0.065;
const WHEEL_Z = 0.86, MOTOR_Z0 = 0.06, MOTOR_L = 0.56;

// chassis plate: rounded rectangle with slots + holes
function plateGeo() { const w = 1.9, h = 1.3, r = 0.16; const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const hole = (x, y, rr) => { const p = new THREE.Path(); p.absarc(x, y, rr, 0, Math.PI * 2, true); s.holes.push(p); };
  const slot = (x, y, L, rr) => { const p = new THREE.Path(); p.moveTo(x - L / 2, y - rr); p.lineTo(x + L / 2, y - rr); p.absarc(x + L / 2, y, rr, -Math.PI / 2, Math.PI / 2, false); p.lineTo(x - L / 2, y + rr); p.absarc(x - L / 2, y, rr, Math.PI / 2, Math.PI * 1.5, false); s.holes.push(p); };
  [[-0.8, -0.5], [0.8, -0.5], [-0.8, 0.5], [0.8, 0.5]].forEach(([x, y]) => hole(x, y, 0.055));
  slot(-0.42, -0.42, 0.34, 0.07); slot(0.42, -0.42, 0.34, 0.07); slot(-0.62, 0.05, 0.16, 0.06); slot(0.62, 0.05, 0.16, 0.06); hole(0, -0.2, 0.05);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 3, curveSegments: 24 });
  g.translate(0, 0, -0.04 - 0.025); return g; }
const plate = new THREE.Group(); { const m = new THREE.Mesh(plateGeo(), M.yellow); m.position.set(0, -0.36, -0.05); plate.add(m);
  // little mounting bracket that holds the motor
  const br = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.1, 0.36), M.slate); br.position.set(0, -0.31, 0.2); plate.add(br); }

const motor = new THREE.Group(); {
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, MOTOR_L * 0.62, 40), M.metal); can.rotation.x = Math.PI / 2; can.position.z = MOTOR_Z0 + MOTOR_L * 0.5; motor.add(can);
  const capB = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.285, MOTOR_L * 0.2, 40), M.teal); capB.rotation.x = Math.PI / 2; capB.position.z = MOTOR_Z0 + MOTOR_L * 0.1; motor.add(capB);
  const capF = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.24, MOTOR_L * 0.2, 40), M.teal); capF.rotation.x = Math.PI / 2; capF.position.z = MOTOR_Z0 + MOTOR_L * 0.9; motor.add(capF);
  const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 24), M.metal); boss.rotation.x = Math.PI / 2; boss.position.z = MOTOR_Z0 + MOTOR_L + 0.02; motor.add(boss);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.36, 16), M.metal); shaft.rotation.x = Math.PI / 2; shaft.position.z = MOTOR_Z0 + MOTOR_L + 0.17; motor.add(shaft);
  // wires to a small connector
  const wire = (pts, mat) => motor.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), 40, 0.022, 8, false), mat));
  wire([[0.08, 0.22, 0.1], [0.22, 0.42, 0.06], [0.45, 0.42, 0.1], [0.6, 0.2, 0.12]], M.red);
  wire([[-0.02, 0.24, 0.1], [0.14, 0.48, 0.04], [0.46, 0.5, 0.06], [0.64, 0.24, 0.1]], M.navy);
  const con = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.1), M.cream); con.position.set(0.64, 0.14, 0.11); motor.add(con);
}

function wheelLathe() { const w = WW, pts = [
  new THREE.Vector2(R * 0.6, -w), new THREE.Vector2(R * 0.97, -w), new THREE.Vector2(R, -w * 0.82), new THREE.Vector2(R, -w * 0.46), new THREE.Vector2(RG, -w * 0.1), new THREE.Vector2(RG, w * 0.1),
  new THREE.Vector2(R, w * 0.46), new THREE.Vector2(R, w * 0.82), new THREE.Vector2(R * 0.97, w), new THREE.Vector2(R * 0.6, w), new THREE.Vector2(R * 0.6, -w)];
  const g = new THREE.LatheGeometry(pts, 96); g.rotateX(Math.PI / 2); return g; }
const wheel = new THREE.Group(); const wheelSpin = new THREE.Group(); wheel.add(wheelSpin); {
  wheelSpin.add(new THREE.Mesh(wheelLathe(), M.slate));
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.6, R * 0.6, WW * 1.3, 64, 1, true), M.yellow); ring.rotation.x = Math.PI / 2; wheelSpin.add(ring);
  const hubBoss = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, WW * 1.9, 32), M.yellow); hubBoss.rotation.x = Math.PI / 2; wheelSpin.add(hubBoss);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, WW * 1.95, 16), M.navy); cap.rotation.x = Math.PI / 2; wheelSpin.add(cap);
  for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; const sp = new THREE.Mesh(new THREE.BoxGeometry(R * 0.5, 0.075, WW * 0.9), M.yellow); sp.position.set(Math.cos(a) * R * 0.34, Math.sin(a) * R * 0.34, 0); sp.rotation.z = a; wheelSpin.add(sp); }
  // yellow tick on the rim face so the turn is readable (as in the game's wheels)
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.02, 16), M.coral); dot.rotation.x = Math.PI / 2; dot.position.set(R * 0.82, 0, WW * 1.0); wheelSpin.add(dot);
}
const band = new THREE.Mesh(new THREE.TorusGeometry(1, BT, 20, 120), M.coral); // radius set by scale on x/y
const bandHolder = new THREE.Group(); bandHolder.add(band);

const bot = new THREE.Group(); scene.add(bot);
bot.add(plate, motor, wheel, bandHolder);

// rope
const ropeTex = ropeTexture(); const ROPE_LEN = 14; ropeTex.repeat.set(1, ROPE_LEN / 0.22);
const rope = new THREE.Group(); { const m = new THREE.Mesh(new THREE.CylinderGeometry(ROPE_R, ROPE_R, ROPE_LEN, 24, 1, true), new THREE.MeshStandardMaterial({ map: ropeTex, roughness: 0.85 }));
  m.position.y = ROPE_LEN / 2; rope.add(m); const end = new THREE.Mesh(new THREE.SphereGeometry(ROPE_R * 1.05, 20, 12), new THREE.MeshStandardMaterial({ color: 0x34384A, roughness: 0.85 })); rope.add(end); }
scene.add(rope);
const ROPE_X = RC + ROPE_R * 0.75;

// soft contact shadow (blob)
const blob = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, 'rgba(35,40,74,0.32)'); rg.addColorStop(1, 'rgba(35,40,74,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; scene.add(m); return m; })();

// "click" bursts: a ring + short dashes, billboarded
function makeBurst(color) { const g = new THREE.Group(); const mat = new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false, depthTest: false, toneMapped: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.86, 1, 64), mat); g.add(ring);
  const dashes = []; for (let i = 0; i < 8; i++) { const d = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.07), mat); const a = i * Math.PI / 4 + Math.PI / 8; d.userData.a = a; d.rotation.z = a; g.add(d); dashes.push(d); }
  g.userData = { mat, ring, dashes }; g.renderOrder = 10; scene.add(g); return g; }
const BURSTS = [];

/* ---------------- timeline helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const spring = u => u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-7 * u) * Math.cos(8.5 * u); // ~7% overshoot, settled at 1
const easeIO = u => u * u * (3 - 2 * u);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const lerp = (a, b, u) => a + (b - a) * u;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function fly(obj, t, t0, t1, from, to, rotFrom, rotTo = [0, 0, 0]) { const u = seg(t, t0, t1); const s = spring(u);
  obj.visible = t >= t0; obj.position.set(lerp(from[0], to[0], s), lerp(from[1], to[1], s), lerp(from[2], to[2], s));
  obj.rotation.set(lerp(rotFrom[0], rotTo[0], s), lerp(rotFrom[1], rotTo[1], s), lerp(rotFrom[2], rotTo[2], s)); return u; }
// a click: small squash on the receiving assembly + burst at a world point
const CLICKS = []; // [time, localPoint, color]
function clickPulse(t) { let k = 0; CLICKS.forEach(([tc]) => { const u = (t - tc) / 0.22; if (u > 0 && u < 1) k = Math.max(k, Math.sin(Math.PI * u) * (1 - u)); }); return k; }

/* ---------------- choreography ---------------- */
// exploded offsets along the motor axis, then collapse
const EXP = { plate: -0.62, wheel: 0.95 };
const TL = { plate: [0.25, 1.15], motor: [1.05, 1.95], wheel: [1.85, 2.8], band: [2.85, 4.05], collapseP: [4.35, 4.85], collapseW: [4.65, 5.15], rope: [5.35, 6.05], grab: 6.1, climb: [6.55, 9.0], end: 10 };
CLICKS.push([TL.plate[0] + 0.33, V(0, -0.36, EXP.plate), 0xFFC83D], [TL.motor[0] + 0.33, V(0, 0, 0.4), 0x1FA898], [TL.wheel[0] + 0.36, V(0, 0, EXP.wheel + WHEEL_Z), 0xF0644A],
  [TL.band[1] - 0.12, V(0, 0, EXP.wheel + WHEEL_Z), 0xF0644A], [TL.collapseP[0] + 0.3, V(0, -0.36, 0.0), 0xFFC83D], [TL.collapseW[0] + 0.3, V(0, 0, WHEEL_Z), 0x1FA898], [TL.grab, V(RC, 0, WHEEL_Z), 0xFFFFFF]);
CLICKS.forEach(c => BURSTS.push(makeBurst(c[2] === 0xFFFFFF ? 0xFFC83D : c[2])));

function climbY(t) { // trapezoid velocity profile: accelerate, cruise, decelerate. Height gained = 1.45
  const [a, b] = TL.climb, H = 1.45, ta = 0.45; const D = b - a; const vmax = H / (D - ta); const x = t - a;
  if (x <= 0) return 0; if (x >= D) return H;
  if (x < ta) return 0.5 * vmax / ta * x * x; if (x > D - ta) { const y = D - x; return H - 0.5 * vmax / ta * y * y; } return 0.5 * vmax * ta + vmax * (x - ta); }

window.renderAt = t => {
  // --- part flights into exploded view
  fly(plate, t, ...TL.plate, [-3.6, -2.2, -2.5], [0, 0, EXP.plate], [-1.1, 1.3, 0.7]);
  fly(motor, t, ...TL.motor, [3.4, 2.4, 1.0], [0, 0, 0], [0.9, -1.6, -0.6]);
  const wu = fly(wheel, t, ...TL.wheel, [-2.2, 2.9, 3.2], [0, 0, EXP.wheel], [0.8, 1.4, 0], [0, 0, 0]);
  // --- band: floats in stretched + tilted, then slips into the groove with a wobble
  { const [b0, b1] = TL.band; bandHolder.visible = t >= b0; const u = seg(t, b0, b1);
    const arrive = spring(clamp(u / 0.55)), slip = seg(u, 0.55, 1);
    const p0 = [1.9, 1.3, EXP.wheel + 2.0], p1 = [0.0, 0.08, EXP.wheel + WHEEL_Z + 0.22];
    let px = lerp(p0[0], p1[0], arrive), py = lerp(p0[1], p1[1], arrive), pz = lerp(p0[2], p1[2], arrive);
    const sl = spring(slip); px = lerp(px, 0, sl); py = lerp(py, 0, sl); pz = lerp(pz, EXP.wheel + WHEEL_Z, sl);
    const stretch = lerp(1.24, 1.0, sl); const rx = lerp(lerp(1.0, 0.5, arrive), 0, sl), ry = lerp(lerp(-0.8, -0.3, arrive), 0, sl);
    const wob = slip > 0 ? Math.exp(-6 * slip) * Math.sin(slip * 30) * 0.06 * (1 - slip) : 0;
    bandHolder.position.set(px, py, pz); bandHolder.rotation.set(rx, ry, 0);
    band.scale.set(RG * stretch * (1 + wob), RG * stretch * (1 - wob) * lerp(0.86, 1, sl), 1); }
  // --- collapse exploded view
  const cp = spring(seg(t, ...TL.collapseP)), cw = spring(seg(t, ...TL.collapseW));
  if (t >= TL.plate[1]) plate.position.z = lerp(EXP.plate, 0, cp);
  if (t >= TL.wheel[1]) wheel.position.z = lerp(EXP.wheel, 0, cw) + WHEEL_Z; else wheel.position.z += WHEEL_Z;
  if (t >= TL.band[1]) { bandHolder.position.set(0, 0, wheel.position.z); bandHolder.rotation.set(0, 0, 0); band.scale.set(RG, RG, 1); }
  // --- rope drops in, bot grabs, climbs
  const ru = seg(t, ...TL.rope); rope.visible = t >= TL.rope[0];
  const ropeBottom = lerp(4.2, -3.2, easeOut(ru)) + (ru >= 1 ? 0 : 0); rope.position.set(ROPE_X, ropeBottom, WHEEL_Z);
  ropeTex.offset.y = 0;
  const y = climbY(t); const dist = y;
  // grab: small swing that settles; climb: tiny sway + body bob
  const g = t - TL.grab; let sway = 0; if (g > 0) sway = 0.06 * Math.exp(-3.2 * g) * Math.sin(g * 9);
  const climbing = t > TL.climb[0] && t < TL.climb[1]; const v = climbing ? 1 : 0;
  sway += v * 0.012 * Math.sin((t - TL.climb[0]) * 14) * seg(t, TL.climb[0], TL.climb[0] + 0.4) * (1 - seg(t, TL.climb[1] - 0.4, TL.climb[1]));
  const stop = t - TL.climb[1]; if (stop > 0) sway += 0.035 * Math.exp(-4 * stop) * Math.sin(stop * 10);
  // hanging pivot is the rope contact point; rotate the bot around it
  const pivot = V(RC, 0, 0); const k = clickPulse(t);
  bot.position.set(0, y, 0); bot.rotation.set(0, 0, 0);
  bot.position.sub(pivot.clone().applyAxisAngle(V(0, 0, 1), sway)).add(pivot); bot.rotation.z = sway;
  bot.scale.set(1 + 0.035 * k, 1 - 0.03 * k, 1 + 0.035 * k);
  // wheel turn = distance / radius (clockwise seen from the front while climbing); spins a little while flying in
  wheelSpin.rotation.z = -dist / RC + (1 - spring(wu)) * 4.0;
  // --- blob shadow on an implied floor during assembly, fades as the rope arrives
  blob.position.set(0.1, -1.55, 0.35); const bs = 2.9; blob.scale.set(bs, bs * 0.55, 1);
  blob.material.opacity = seg(t, 0.2, 1.0) * (1 - seg(t, TL.rope[0], TL.rope[1] + 0.3));
  // --- camera: 3/4 view that swings wider for the exploded spread, then settles for the climb hero
  const az = lerp(lerp(0.62, 0.95, easeIO(seg(t, 0, 3.4))), -0.46, easeIO(seg(t, 4.3, 7.2))) + 0.06 * easeIO(seg(t, 7.2, 10));
  const el = lerp(0.24, 0.07, easeIO(seg(t, 3.0, 9.5)));
  const dist0 = lerp(lerp(5.6, 6.3, easeIO(seg(t, 1.5, 3.6))), 5.2, easeIO(seg(t, 4.4, 7.2)));
  const tgt = V(lerp(0.15, 0.12, easeIO(seg(t, 4.5, 7))), -0.12 + 0.82 * y + 0.12 * easeIO(seg(t, 5.0, 7.0)), lerp(0.55, WHEEL_Z * 0.6, easeIO(seg(t, 4, 6))));
  cam.position.set(tgt.x + Math.sin(az) * Math.cos(el) * dist0, tgt.y + Math.sin(el) * dist0, tgt.z + Math.cos(az) * Math.cos(el) * dist0); cam.lookAt(tgt);
  // --- bursts
  CLICKS.forEach(([tc, lp], i) => { const B = BURSTS[i]; const u = (t - tc) / 0.42; B.visible = u > 0 && u < 1; if (!B.visible) return;
    const wp = lp.clone(); bot.localToWorld(wp); B.position.copy(wp); B.quaternion.copy(cam.quaternion);
    const e = easeOut(u); const s = lerp(0.18, 0.62, e); B.userData.ring.scale.setScalar(s); B.userData.mat.opacity = 0.7 * (1 - u) * (1 - u * 0.3);
    B.userData.dashes.forEach(d => { const r = lerp(0.35, 0.95, e); d.position.set(Math.cos(d.userData.a) * r, Math.sin(d.userData.a) * r, 0); d.scale.set(lerp(1, 0.4, u), 1, 1); }); });
  renderer.render(scene, cam);
  // --- composite over the lens background
  const gr = o2.createLinearGradient(0, 0, 0, OH); gr.addColorStop(0, '#DDEBFA'); gr.addColorStop(1, '#F6EEDF'); o2.fillStyle = gr; o2.fillRect(0, 0, OW, OH);
  const sp = o2.createRadialGradient(OW * 0.5, OH * 0.45, 0, OW * 0.5, OH * 0.45, OW * 0.55); sp.addColorStop(0, 'rgba(255,255,255,0.55)'); sp.addColorStop(1, 'rgba(255,255,255,0)'); o2.fillStyle = sp; o2.fillRect(0, 0, OW, OH);
  o2.imageSmoothingQuality = 'high'; o2.drawImage(glc, 0, 0, OW, OH);
};
window.renderAt(0);
window.READY_DONE = true;
</script></body></html>
